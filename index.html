<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay Cummings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f4f0;
      color: #1a1a18;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      padding: 1.1rem 2rem;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      background: #f5f4f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 16px;
      font-style: italic;
      letter-spacing: -0.01em;
    }

    .layout {
      display: grid;
      grid-template-columns: 190px 1fr;
      min-height: calc(100vh - 50px);
    }

    .sidebar {
      border-right: 1px solid rgba(0,0,0,0.1);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 50px;
      height: calc(100vh - 50px);
    }

    .main-tabs {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .tab {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 2px 0;
      display: inline-block;
      transition: opacity 0.15s;
      user-select: none;
      color: #1a1a18;
    }

    .tab.active {
      border-bottom: 2px solid #1a1a18;
      opacity: 1;
    }

    .tab:not(.active) {
      border-bottom: none;
      opacity: 0.3;
    }

    .tab:not(.active):hover {
      opacity: 0.6;
    }

    .sidebar-divider {
      height: 1px;
      background: rgba(0,0,0,0.1);
      margin: 1.75rem 0;
    }

    .sec-links {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .sec-link {
      font-size: 12px;
      opacity: 0.4;
      color: #1a1a18;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      transition: opacity 0.15s;
      letter-spacing: 0.01em;
    }

    .sec-link:hover {
      opacity: 0.9;
    }

    .sec-link-sub {
      font-size: 10px;
      opacity: 0.3;
      display: block;
      margin-top: 1px;
      letter-spacing: 0.01em;
    }

    .main {
      overflow: hidden;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .photo-full {
      width: 100%;
      height: 340px;
      background: rgba(0,0,0,0.07);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-full img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .photo-placeholder {
      font-size: 12px;
      opacity: 0.3;
      font-style: italic;
      letter-spacing: 0.04em;
    }

    .about-section {
      padding: 3.5rem 4rem;
    }

    .about-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      opacity: 0.4;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .about-name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(42px, 5vw, 64px);
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 1.5rem;
    }

    .about-bio {
      font-size: 16px;
      opacity: 0.55;
      max-width: 440px;
      line-height: 1.85;
      font-weight: 300;
    }

    .projects-inner {
      padding: 3.5rem 4rem;
    }

    .panel-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      opacity: 0.4;
      margin-bottom: 2rem;
      font-weight: 500;
    }

    .placeholder {
      border: 1px dashed rgba(0,0,0,0.15);
      border-radius: 12px;
      padding: 6rem 2rem;
      text-align: center;
    }

    .placeholder p {
      font-size: 14px;
      opacity: 0.4;
      font-style: italic;
    }

    @media (max-width: 640px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        padding: 1.25rem 1.5rem;
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .main-tabs { flex-direction: row; gap: 1rem; }
      .sidebar-divider { display: none; }
      .sec-links { flex-direction: row; gap: 1rem; }
      .about-section, .projects-inner { padding: 2.5rem 1.5rem; }
      .photo-full { height: 220px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="topbar-name">Jay Cummings</span>
  </div>

  <div class="layout">

    <div class="sidebar">
      <div class="main-tabs">
        <span class="tab active" onclick="switchTab('home', this)">Home</span>
        <span class="tab" onclick="switchTab('projects', this)">Projects</span>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sec-links">

        <!-- RESUME: replace the href with your actual GitHub resume URL once uploaded -->
        <a class="sec-link" href="Jay_Cummings_Resume.pdf" target="_blank">
          Resume
        </a>

        <a class="sec-link" href="https://linkedin.com/in/jay-cummings-aa9079250/" target="_blank">
          LinkedIn
        </a>

        <!-- EMAIL with address shown underneath -->
        <a class="sec-link" href="mailto:jaytcummings31@gmail.com">
          Email
          <span class="sec-link-sub">jaytcummings31@gmail.com</span>
        </a>

      </div>
    </div>

    <div class="main">

      <div id="panel-home" class="panel active">

        <!-- PHOTO: rename your photo to photo.jpg and upload it to GitHub -->
        <div class="photo-full">
          <img
            src="photo.jpg"
            alt="Jay Cummings"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <span class="photo-placeholder" style="display:none;">Photo coming soon</span>
        </div>

        <div class="about-section">
          <p class="about-label">ABOUT</p>

          <!-- EDIT YOUR NAME HERE -->
          <h1 class="about-name">Jay<br>Cummings</h1>

          <!-- EDIT YOUR BIO HERE -->
          <p class="about-bio">
            Marketing & Business student at Wake Forest University. I build events, teams, and community programs that actually mean something.
          </p>
        </div>

      </div>

      <div id="panel-projects" class="panel">
        <div class="projects-inner">
          <p class="panel-label">PROJECTS</p>

          <!-- DELETE this when you have real projects -->
          <div class="placeholder">
            <p>Projects coming soon.</p>
          </div>

          <!-- HOW TO ADD A PROJECT LATER — copy this block for each one:

          <div style="margin-bottom: 2.5rem; padding-bottom: 2.5rem; border-bottom: 1px solid rgba(0,0,0,0.08);">
            <p style="font-size: 11px; letter-spacing: 0.1em; opacity: 0.4; margin-bottom: 0.5rem;">2025</p>
            <h2 style="font-family: 'Instrument Serif', serif; font-size: 24px; font-weight: 400; margin-bottom: 0.6rem;">Project Name</h2>
            <p style="font-size: 15px; opacity: 0.55; line-height: 1.8; max-width: 480px;">Short description of what the project was and what you did.</p>
          </div>

          -->
        </div>
      </div>

    </div>
  </div>

  <script>
    function switchTab(name, el) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      el.classList.add('active');
    }

    window.addEventListener('load', function () {
      const img = document.querySelector('.photo-full img');
      if (img && (img.naturalWidth === 0)) {
        img.style.display = 'none';
        img.nextElementSibling.style.display = 'block';
      }
    });
  </script>

</body>
</html>
